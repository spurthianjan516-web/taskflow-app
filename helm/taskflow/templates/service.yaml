apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app:     {{ .Values.appName }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.appName }}
  ports:
    - name:       http
      protocol:   TCP
      port:       {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
